<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Simbolo Track Bay: o portico da baia visto de frente, com o veiculo dentro.
    Mesma geometria do componente MarcaSimbolo (src/components/Marca.tsx) —
    se um mudar, o outro muda junto.

    Sem texto de proposito: os PNGs do manifesto sao renderizados a partir deste
    arquivo fora do navegador, onde webfont nao carrega.
  -->
  <defs>
    <linearGradient id="placa" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#26262d" />
      <stop offset="55%" stop-color="#17171b" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>
    <radialGradient id="metal" cx="36%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#c9c9d0" />
      <stop offset="100%" stop-color="#5b5b64" />
    </radialGradient>
    <linearGradient id="carro" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6a6a76" />
      <stop offset="100%" stop-color="#30303a" />
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#placa)" />
  <!-- Contorno claro para a placa nao sumir numa aba de navegador escura -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none"
        stroke="rgba(255,255,255,0.14)" stroke-width="1" />

  <path d="M15.2 50 L15.2 28 Q15.2 20.2 23 20.2 L41 20.2 Q48.8 20.2 48.8 28 L48.8 50 Z"
        fill="#08080a" />

  <g fill="#2e2e37">
    <rect x="19.8" y="43.5" width="6" height="6.5" rx="1.6" />
    <rect x="38.2" y="43.5" width="6" height="6.5" rx="1.6" />
  </g>
  <path d="M22.8 39 L25.4 31 Q26 29.2 28 29.2 L36 29.2 Q38 29.2 38.6 31 L41.2 39 Z" fill="url(#carro)" />
  <path d="M25 37.2 L26.9 31.9 Q27.2 31 28.3 31 L35.7 31 Q36.8 31 37.1 31.9 L39 37.2 Z" fill="#0d0d12" />
  <rect x="18.5" y="37.5" width="27" height="9" rx="3" fill="url(#carro)" />
  <rect x="21.5" y="43.4" width="21" height="2" rx="1" fill="#16161c" opacity="0.75" />
  <g fill="#ffffff" opacity="0.92">
    <rect x="20.5" y="39.8" width="5.2" height="2.6" rx="1.3" />
    <rect x="38.3" y="39.8" width="5.2" height="2.6" rx="1.3" />
  </g>

  <path d="M10 50 L10 28 Q10 15 23 15 L41 15 Q54 15 54 28 L54 50 Z
           M15.2 50 L15.2 28 Q15.2 20.2 23 20.2 L41 20.2 Q48.8 20.2 48.8 28 L48.8 50 Z"
        fill-rule="evenodd" fill="url(#metal)" />

  <rect x="6" y="50" width="52" height="2.8" rx="1.4" fill="url(#piso)" />
</svg>
