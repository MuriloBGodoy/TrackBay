<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Simbolo Track Wheel: pneu de frente, aro de liga e o monograma TW.
    Mesma geometria do componente MarcaSimbolo (src/components/Marca.tsx) —
    se um mudar, o outro muda junto.
  -->
  <defs>
    <radialGradient id="aro" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#c9c9d0" />
      <stop offset="100%" stop-color="#5b5b64" />
    </radialGradient>
    <linearGradient id="pneu" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#3a3a42" />
      <stop offset="55%" stop-color="#1d1d21" />
      <stop offset="100%" stop-color="#0d0d10" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#pneu)" />
  <!-- Contorno claro para o pneu nao sumir numa aba de navegador escura -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
  <circle cx="32" cy="32" r="27.4" fill="none" stroke="#08080a" stroke-width="4.4"
          stroke-dasharray="3.4 3.6" opacity="0.75" />
  <circle cx="32" cy="32" r="24.6" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" />

  <circle cx="32" cy="32" r="22.6" fill="url(#aro)" />
  <circle cx="32" cy="32" r="19.8" fill="#15151a" />
  <g fill="url(#aro)" opacity="0.34">
    <path d="M32 26.5 L36.4 13.4 Q32 11.6 27.6 13.4 Z" />
    <path d="M32 26.5 L36.4 13.4 Q32 11.6 27.6 13.4 Z" transform="rotate(72 32 32)" />
    <path d="M32 26.5 L36.4 13.4 Q32 11.6 27.6 13.4 Z" transform="rotate(144 32 32)" />
    <path d="M32 26.5 L36.4 13.4 Q32 11.6 27.6 13.4 Z" transform="rotate(216 32 32)" />
    <path d="M32 26.5 L36.4 13.4 Q32 11.6 27.6 13.4 Z" transform="rotate(288 32 32)" />
  </g>
  <circle cx="32" cy="32" r="3.6" fill="url(#aro)" opacity="0.5" />

  <text x="32" y="33.4" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk','Segoe UI Black','Arial Black',sans-serif"
        font-size="21" font-weight="800" letter-spacing="-2"
        fill="#ffffff" stroke="#0b0b0e" stroke-width="2.6" paint-order="stroke"
        transform="skewX(-9) translate(5.3 0)">TW</text>
</svg>
