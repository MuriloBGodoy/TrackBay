spring.application.name=trackwheel-backend

# Perfil dev: repositorios in-memory + auth simulada, roda sem credencial do Firebase.
# Em producao use --spring.profiles.active=prod e configure trackwheel.firebase.*
spring.profiles.active=dev

server.port=8080

# A API troca datas em ISO-8601; a formatacao pt-BR (dd/MM/yyyy, virgula decimal) fica no front.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Documentacao: Scalar em /docs, Swagger UI em /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

# Credencial do Firebase (obrigatoria fora do perfil dev)
trackwheel.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
trackwheel.firebase.project-id=${FIREBASE_PROJECT_ID:}
# Bucket do Storage (fotos e assinatura), ex.: seu-projeto.appspot.com
trackwheel.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

# Foto de celular passa longe do 1MB padrao do Spring.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Origens permitidas do front
trackwheel.cors.origins=http://localhost:5173,http://localhost:4173

logging.level.com.trackwheel=INFO
